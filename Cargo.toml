[package]
name = "spm"
version = "2026.9.0"
edition = "2024"
description = "A package manager for the SepiaOS operating system."

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
# Ed25519, for signatures. Already in the tree - `ureq`'s rustls pulls it in
# and the cross-build already compiles its C and assembly - so this costs no new
# dependency, no new C toolchain requirement, and nothing that was not already
# proven to build for aarch64-musl.
ring = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"
ureq = { version = "3.4.1", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

# How much room is left on the card. There is no such thing in `std`, and the
# alternative is `statvfs` through `libc`, which would be this crate's only
# `unsafe`. `rustix` is already in the tree - `tempfile` pulls it in - so
# enabling one more of its features costs nothing that is not already paid for.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

# Configured here rather than on the CI command line, so that a build in a
# worktree enforces exactly what CI does. A lint that only fires in CI is
# discovered at the worst possible moment.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
rcgen = "0.14.10"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
