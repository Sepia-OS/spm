[package]
name = "spm"
version = "0.1.0-replace-me"
edition = "2024"
description = "A package manager for the SepiaOS operating system."

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.20"

# Configured here rather than on the CI command line, so that a build in a
# worktree enforces exactly what CI does. A lint that only fires in CI is
# discovered at the worst possible moment.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
